<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Table QR Food Ordering System</title>
  <link id="page-favicon" rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem; position: relative;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" style="display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: linear-gradient(135deg, #f97316, #ea580c); border-radius: 18px; margin-bottom: 1rem; box-shadow: var(--shadow-glow); text-decoration: none; overflow: hidden; padding: 6px;">
        <img src="/assets/img/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </a>
      <h1 style="font-size: 1.6rem; font-weight: 700; color: white;">เข้าสู่ระบบจัดการ</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Store Management & Platform Admin</p>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" required placeholder="เช่น manager, staff, admin"
               style="width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: white; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
               onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-glass)'">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">รหัสผ่าน (Password)</label>
        <input type="password" id="password" required placeholder="••••••••"
               style="width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: white; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
               onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-glass)'">
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
        เข้าสู่ระบบ 🚀
      </button>
    </form>

    <!-- LINE Login Button -->
    <div style="margin-top: 1.25rem; text-align: center;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem;">
        <div style="flex: 1; height: 1px; background: var(--border-glass);"></div>
        <span style="font-size: 0.8rem; color: var(--text-dim);">หรือ</span>
        <div style="flex: 1; height: 1px; background: var(--border-glass);"></div>
      </div>

      <button type="button" id="btn-line-login" onclick="loginWithLine()" class="btn-line btn-block"
        style="padding: 12px 16px; font-size: 0.95rem; width: 100%;">
        <span class="line-icon-wrap">
          <svg viewBox="0 0 24 24" fill="#06C755">
            <path d="M12 2C6.48 2 2 5.92 2 10.75c0 4.31 3.65 7.91 8.57 8.63.33.07.79.22.9.52.1.28.07.72.03 1-.06.4-.33 1.37-.36 1.53-.1.44-.45 1.73 1.52.94 1.97-.79 5.34-3.21 7.29-5.5 2.67-3.13 2.05-7.12 2.05-7.12C22 5.92 17.52 2 12 2zm-4.7 11.23h-1.5a.65.65 0 01-.65-.65V8.13c0-.36.29-.65.65-.65h1.5c.36 0 .65.29.65.65v4.45c0 .36-.29.65-.65.65zm2.84 0h-.92a.65.65 0 01-.65-.65V8.13c0-.36.29-.65.65-.65h.92c.36 0 .65.29.65.65v4.45c0 .36-.29.65-.65.65zm4.84-2.83l-1.92-2.58h-.02v2.58c0 .36-.29.65-.65.65h-.92a.65.65 0 01-.65-.65V8.13c0-.36.29-.65.65-.65h1.17l1.92 2.58h.02V8.13c0-.36.29-.65.65-.65h.92c.36 0 .65.29.65.65v4.45c0 .36-.29.65-.65.65h-.54zm4.12 2.83h-2.92a.65.65 0 01-.65-.65V8.13c0-.36.29-.65.65-.65h2.92c.36 0 .65.29.65.65v.65c0 .36-.29.65-.65.65h-1.62v.65h1.62c.36 0 .65.29.65.65v.65c0 .36-.29.65-.65.65h-1.62v.65h1.62c.36 0 .65.29.65.65v.65c0 .36-.29.65-.65.65z"/>
          </svg>
        </span>
        <span>เข้าสู่ระบบด้วย LINE (Log in with LINE)</span>
      </button>

      <div style="margin-top: 10px;">
        <a href="https://lin.ee/sHKiMFg" target="_blank" rel="noopener noreferrer" style="color: #4ade80; font-size: 0.85rem; text-decoration: none; font-weight: 500;">
          ✨ ยังไม่มีร้านค้า? สมัครทดลองใช้งานฟรี 30 วัน →
        </a>
      </div>
    </div>


  </div>

  <script src="/js/app.js"></script>
  <script>
    async function doLogin(username, password) {
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'กำลังตรวจสอบ...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          localStorage.setItem('auth_token', data.token);
          App.toast('เข้าสู่ระบบสำเร็จ กำลังนำทาง...', 'success');
          setTimeout(() => {
            window.location.href = data.redirectUrl || '/store.html';
          }, 600);
        } else {
          App.toast(data.message || 'เข้าสู่ระบบไม่สำเร็จ', 'danger');
          btn.disabled = false;
          btn.innerText = 'เข้าสู่ระบบ 🚀';
        }
      } catch (err) {
        App.toast('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์', 'danger');
        btn.disabled = false;
        btn.innerText = 'เข้าสู่ระบบ 🚀';
      }
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      doLogin(u, p);
    });

    async function loginWithLine() {
      const btn = document.getElementById('btn-line-login');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="line-icon-wrap">⏳</span> กำลังเชื่อมต่อ LINE...';
      }

      try {
        const configRes = await fetch('/api/auth/line/config');
        const config = await configRes.json();

        if (config.success && config.isConfigured) {
          const urlRes = await fetch('/api/auth/line/auth-url?state=login');
          const urlData = await urlRes.json();
          if (urlData.success && urlData.authUrl) {
            window.location.href = urlData.authUrl;
            return;
          }
        }

        // Fast Connect Prompt or redirect to index with trial
        const lineUserId = prompt('จำลองระบุ LINE User ID เพื่อเข้าสู่ระบบ (เช่น U_somchai_food หรือ กดตกลงเพื่อใช้บัญชีตัวอย่าง):', 'U_somchai_food');
        if (!lineUserId) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<span class="line-icon-wrap"><svg viewBox="0 0 24 24" fill="#06C755"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 4.31 3.65 7.91 8.57 8.63.33.07.79.22.9.52.1.28.07.72.03 1-.06.4-.33 1.37-.36 1.53-.1.44-.45 1.73 1.52.94 1.97-.79 5.34-3.21 7.29-5.5 2.67-3.13 2.05-7.12 2.05-7.12C22 5.92 17.52 2 12 2z"/></svg></span><span>เข้าสู่ระบบด้วย LINE (Log in with LINE)</span>`;
          }
          return;
        }

        const res = await fetch('/api/auth/line/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ line_user_id: lineUserId })
        });

        const data = await res.json();
        if (data.success) {
          if (!data.isNewUser && data.token) {
            localStorage.setItem('auth_user', JSON.stringify(data.user));
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('food_token', data.token);
            App.toast('เข้าสู่ระบบด้วย LINE สำเร็จ กำลังนำทาง...', 'success');
            setTimeout(() => {
              window.location.href = data.redirectUrl || '/store.html';
            }, 600);
          } else {
            // New user without store
            App.toast('บัญชี LINE นี้ยังไม่มีร้านค้า กำลังพาท่านไปเปิดร้านทดลองใช้ฟรี...', 'info');
            setTimeout(() => {
              window.location.href = `/?line_step=setup&line_id=${encodeURIComponent(lineUserId)}&line_name=${encodeURIComponent('ผู้ใช้ LINE')}`;
            }, 1000);
          }
        } else {
          App.toast(data.message || 'เข้าสู่ระบบ LINE ไม่สำเร็จ', 'danger');
        }
      } catch (err) {
        App.toast('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์', 'danger');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span class="line-icon-wrap"><svg viewBox="0 0 24 24" fill="#06C755"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 4.31 3.65 7.91 8.57 8.63.33.07.79.22.9.52.1.28.07.72.03 1-.06.4-.33 1.37-.36 1.53-.1.44-.45 1.73 1.52.94 1.97-.79 5.34-3.21 7.29-5.5 2.67-3.13 2.05-7.12 2.05-7.12C22 5.92 17.52 2 12 2z"/></svg></span><span>เข้าสู่ระบบด้วย LINE (Log in with LINE)</span>`;
        }
      }
    }

  </script>
</body>
</html>

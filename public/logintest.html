<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Table QR Food Ordering System</title>
  <link id="page-favicon" rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem; position: relative;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" style="display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: linear-gradient(135deg, #f97316, #ea580c); border-radius: 18px; margin-bottom: 1rem; box-shadow: var(--shadow-glow); text-decoration: none; overflow: hidden; padding: 6px;">
        <img src="/assets/img/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </a>
      <h1 style="font-size: 1.6rem; font-weight: 700; color: white;">เข้าสู่ระบบจัดการ</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Store Management & Platform Admin</p>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" required placeholder="เช่น manager, staff, admin"
               style="width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: white; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
               onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-glass)'">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">รหัสผ่าน (Password)</label>
        <input type="password" id="password" required placeholder="••••••••"
               style="width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: white; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
               onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-glass)'">
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
        เข้าสู่ระบบ 🚀
      </button>
    </form>

    <!-- Quick 1-Click Demo Logins -->
    <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-glass); padding-top: 1.25rem;">
      <p style="font-size: 0.8rem; color: var(--text-dim); text-align: center; margin-bottom: 12px; font-weight: 500;">
        ✨ เลือกบัญชีสาธิตเพื่อเข้าใช้งานทันที (1-Click Login):
      </p>
      <div style="display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px;">
        
        <!-- Super Admin -->
        <button type="button" class="btn btn-secondary btn-sm" style="text-align: left; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(139, 92, 246, 0.12); border-color: rgba(139, 92, 246, 0.35);" onclick="quickLogin('admin', 'admin123')">
          <div>
            <div style="font-weight: 700; color: white; font-size: 0.88rem;">👑 ผู้ดูแลระบบส่วนกลาง (Super Admin)</div>
            <div style="font-size: 0.72rem; color: #c4b5fd;">เข้าหน้าศูนย์ควบคุม / จัดการทุกร้านค้า</div>
          </div>
          <span style="font-size: 0.72rem; font-family: monospace; background: rgba(139, 92, 246, 0.25); color: #ddd6fe; padding: 2px 7px; border-radius: 4px; font-weight: 600;">admin</span>
        </button>

        <!-- Starter Store -->
        <button type="button" class="btn btn-secondary btn-sm" style="text-align: left; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.25);" onclick="quickLogin('starter_mgr', 'password123')">
          <div>
            <div style="font-weight: 700; color: white; font-size: 0.88rem;">☕ เจ้าของร้าน - มินิคาเฟ่ (Mini Cafe)</div>
            <div style="font-size: 0.72rem; color: #7dd3fc;"><span class="badge" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; padding: 1px 5px;">Starter Plan</span> ฿290/ด.</div>
          </div>
          <span style="font-size: 0.72rem; font-family: monospace; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px;">starter_mgr</span>
        </button>

        <!-- Pro Store Manager -->
        <button type="button" class="btn btn-secondary btn-sm" style="text-align: left; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(249, 115, 22, 0.08); border-color: rgba(249, 115, 22, 0.3);" onclick="quickLogin('manager', 'manager123')">
          <div>
            <div style="font-weight: 700; color: white; font-size: 0.88rem;">🍲 เจ้าของร้าน - ส้มตำแซ่บนัว (Somtum Zaab)</div>
            <div style="font-size: 0.72rem; color: #fdba74;"><span class="badge" style="background: rgba(249, 115, 22, 0.2); color: #fb923c; font-size: 0.65rem; padding: 1px 5px;">Professional</span> ฿490/ด.</div>
          </div>
          <span style="font-size: 0.72rem; font-family: monospace; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px;">manager</span>
        </button>

        <!-- Pro Store Staff -->
        <button type="button" class="btn btn-secondary btn-sm" style="text-align: left; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(255,255,255,0.02); border-color: var(--border-glass);" onclick="quickLogin('staff', 'staff123')">
          <div>
            <div style="font-weight: 600; color: white; font-size: 0.86rem;">🍳 พนักงาน / ครัว - ส้มตำแซ่บนัว</div>
            <div style="font-size: 0.72rem; color: var(--text-dim);">เข้าหน้าสั่งอาหาร & จอครัว KDS</div>
          </div>
          <span style="font-size: 0.72rem; font-family: monospace; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px;">staff</span>
        </button>

        <!-- Enterprise Store -->
        <button type="button" class="btn btn-secondary btn-sm" style="text-align: left; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(236, 72, 153, 0.08); border-color: rgba(236, 72, 153, 0.3);" onclick="quickLogin('enterprise_mgr', 'password123')">
          <div>
            <div style="font-weight: 700; color: white; font-size: 0.88rem;">🥩 เจ้าของร้าน - แกรนด์บุฟเฟต์ (Grand Buffet)</div>
            <div style="font-size: 0.72rem; color: #f472b6;"><span class="badge" style="background: rgba(236, 72, 153, 0.2); color: #f472b6; font-size: 0.65rem; padding: 1px 5px;">Enterprise</span> ฿999/ด.</div>
          </div>
          <span style="font-size: 0.72rem; font-family: monospace; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px;">enterprise_mgr</span>
        </button>

      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="/" style="color: var(--text-dim); font-size: 0.85rem; text-decoration: none;">← กลับสู่หน้าหลัก</a>
    </div>

  </div>

  <script src="/js/app.js"></script>
  <script>
    async function doLogin(username, password) {
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'กำลังตรวจสอบ...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          localStorage.setItem('auth_token', data.token);
          App.toast('เข้าสู่ระบบสำเร็จ กำลังนำทาง...', 'success');
          setTimeout(() => {
            window.location.href = data.redirectUrl || '/store.html';
          }, 600);
        } else {
          App.toast(data.message || 'เข้าสู่ระบบไม่สำเร็จ', 'danger');
          btn.disabled = false;
          btn.innerText = 'เข้าสู่ระบบ 🚀';
        }
      } catch (err) {
        App.toast('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์', 'danger');
        btn.disabled = false;
        btn.innerText = 'เข้าสู่ระบบ 🚀';
      }
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      doLogin(u, p);
    });

    function quickLogin(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      doLogin(u, p);
    }
  </script>
</body>
</html>
